# Project-wide Gradle settings.

# Give the Gradle daemon enough heap and use UTF-8.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent modules in parallel where possible.
org.gradle.parallel=true

# Use AndroidX instead of the legacy Android Support Library.
android.useAndroidX=true

# Non-transitive R classes (modern default) for faster, smaller builds.
android.nonTransitiveRClass=true
