name: Build Sideload APK

# Builds a debug APK that is automatically signed with the Android debug
# keystore, so it can be installed (sideloaded) directly onto a device via
# `adb install` or by opening the file on the phone.
#
# - Every push / PR: build the APK and upload it as a workflow artifact.
# - Manual run (Run workflow button): same, on demand.
# - Pushing a tag like `v0.5` / `v1.0`: also publish a GitHub Release with the
#   APK attached, giving end users a stable download link to sideload from.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write  # required to create the GitHub Release on tags

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 3.3 + Android Gradle Plugin 2.3.3 require JDK 8.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Install the exact legacy SDK packages this project pins.
      - name: Install legacy SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-17" \
            "platforms;android-16" \
            "build-tools;25.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :aMP:assembleDebug --stacktrace --no-daemon

      # Surface the APK at a predictable path for the upload/release steps.
      - name: Locate APK
        id: apk
        run: |
          APK=$(find aMP/build/outputs/apk -name '*debug*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK found" >&2
            find aMP/build/outputs -type f || true
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amp-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # On a version tag, publish a Release with the APK so it can be sideloaded
      # straight from the repo's Releases page.
      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Sideloadable debug build of A.M.P.

            **To install:** download the `.apk` below onto your Android device
            and open it (enable "Install unknown apps" for your browser/file
            manager), or run `adb install <file>.apk` from a computer.
