plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dmgproductions.amp'
    compileSdk 35

    defaultConfig {
        applicationId "com.dmgproductions.amp"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // This project ships AIDL interfaces (gesture recognition service);
        // AGP 8 disables AIDL by default, so enable it explicitly.
        aidl = true
    }
}

dependencies {
    implementation project(':circleLayout')
    implementation project(':slidinglib')
    implementation project(':seekArc_library')
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Align all Kotlin stdlib artifacts to one version. Since Kotlin 1.8 the
    // -jdk7/-jdk8 stdlib modules were merged into kotlin-stdlib; transitive
    // AndroidX deps pull both old (1.6.21) and new (1.8.22) variants, which
    // collide as duplicate classes. The BOM forces a single aligned version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
}
