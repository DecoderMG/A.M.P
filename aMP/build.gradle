plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dmgproductions.amp'
    compileSdk 35

    defaultConfig {
        applicationId "com.dmgproductions.amp"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':circleLayout')
    implementation project(':slidinglib')
    implementation project(':seekArc_library')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
